services:
  postgres:
    image: postgres:16-alpine
    container_name: abssai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abssai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abssai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-abssai_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abssai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - abssai-network

  redis:
    image: redis:7-alpine
    container_name: abssai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - abssai-network

volumes:
  postgres_data:
  redis_data:

networks:
  abssai-network:
    driver: bridge
